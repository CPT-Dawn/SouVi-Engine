description = "YouTube / Vimeo / web 1080p. H.264 High, high bitrate, plays everywhere."
[video]
codec = "libx264"
width = 1920
height = 1080
pix_fmt = "yuv420p"
crf = 16
preset = "slow"
params = ["-profile:v", "high", "-x264-params", "aq-mode=3:deblock=-1,-1"]
[audio]
codec = "aac"
bitrate = "320k"
sample_rate = 48000
channels = 2
[loudness]
integrated = -14.0
true_peak = -1.0
[container]
ext = "mp4"
params = ["-movflags", "+faststart"]
